name: build
on:
  schedule: [{cron: "0 */6 * * *"}]
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python test_build.py && python build.py
      - uses: actions/upload-artifact@v4
        with: {name: public, path: public}
